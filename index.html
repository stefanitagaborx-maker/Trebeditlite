<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrebEdit Lite</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #1e1e1e;
  color: white;
  height: 100vh;
  display: flex;
}

/* Sidebar */
#files {
  width: 140px;
  background: #252526;
  border-right: 2px solid #333;
  padding: 10px;
}

.file {
  padding: 6px;
  font-size: 13px;
  color: #ccc;
}

/* Editor */
#editor {
  width: 40%;
  display: flex;
  flex-direction: column;
}

#tabs {
  background: #2d2d2d;
  padding: 8px;
}

textarea {
  flex: 1;
  background: #1e1e1e;
  color: #00ff90;
  border: none;
  padding: 10px;
  font-size: 14px;
  outline: none;
}

/* Preview */
#preview {
  width: 40%;
  background: white;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Buttons */
#top {
  display: flex;
  gap: 5px;
  padding: 5px;
  background: #333;
}

button {
  font-size: 12px;
}
</style>
</head>

<body>

<div id="files">
  📁 files<br><br>
  📄 index.html<br>
  📄 style.css<br>
  📄 script.js
</div>

<div id="editor">
  <div id="top">
    <button onclick="run()">▶ Run</button>
    <button onclick="save()">💾 Save</button>
  </div>

<textarea id="code">
<!DOCTYPE html>
<html>
<body style="margin:0;background:black;color:white;text-align:center;">

<h1>My Game 🎮</h1>
<p>Tap the button</p>

<button onclick="score++; s.innerText=score">
Click
</button>

<p>Score: <span id="s">0</span></p>

<script>
let score = 0;
</script>

</body>
</html>
</textarea>
</div>

<div id="preview">
  <iframe id="out"></iframe>
</div>

<script>
const t = document.getElementById("code");
const o = document.getElementById("out");

function run() {
  o.srcdoc = t.value;
}

t.addEventListener("input", run);
run();

function save() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(
    new Blob([t.value], {type:"text/html"})
  );
  a.download = "index.html";
  a.click();
}
</script>

</body>
</html>
